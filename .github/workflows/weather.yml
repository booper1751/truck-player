name: 更新氣象資料

on:
  schedule:
    - cron: "7,37 * * * *"      # 每小時的 07 分和 37 分 (GitHub 有時會晚幾分鐘才跑)
  workflow_dispatch:             # 也可以在 Actions 分頁按「Run workflow」手動跑一次

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: true

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 向中央氣象署抓資料
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}      # 授權碼只存在 GitHub Secrets
        run: python weather/fetch_cwa.py weather.json

      - name: 發佈到 weather-data 分支 (只有 weather.json 一個檔案)
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git checkout --orphan weather-data
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name weather.json -exec rm -rf {} +
          git add weather.json
          git commit -qm "weather $(date -u +%FT%TZ)"
          git push -q --force origin weather-data
