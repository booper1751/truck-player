name: 打包 EXE 並發佈

on:
  push:
    branches: [main, master]
    paths:
      - "ets2_player_qt.py"
      - "requirements.txt"
      - "icon.ico"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: 讀出程式裡的版本號
        id: v
        shell: bash
        run: |
          VER=$(grep -m1 -E '^VERSION *= *[0-9]+' ets2_player_qt.py | sed -E 's/^VERSION *= *([0-9]+).*/\1/')
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VER 已經發佈過了，這次不重複打包 (要發新版請把 VERSION 加 1)。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.v.outputs.exists != 'true'
        with:
          python-version: "3.12"

      - name: 安裝套件
        if: steps.v.outputs.exists != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 帶入更新來源 (只放進 EXE，不會改到倉庫裡的原始碼)
        if: steps.v.outputs.exists != 'true'
        shell: python
        run: |
          import re
          p = "ets2_player_qt.py"
          s = open(p, encoding="utf-8").read()
          s, n = re.subn(r'^UPDATE_SRC_DEFAULT = ""', 'UPDATE_SRC_DEFAULT = "${{ github.repository }}"', s, count=1, flags=re.M)
          assert n == 1, "找不到 UPDATE_SRC_DEFAULT 那一行"
          open(p, "w", encoding="utf-8").write(s)

      - name: 打包
        if: steps.v.outputs.exists != 'true'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name TruckPlayer --icon icon.ico \
            --hidden-import mutagen --hidden-import keyboard \
            --collect-submodules edge_tts --hidden-import aiohttp --collect-data certifi \
            ets2_player_qt.py
          ls -l dist

      - name: 發佈
        if: steps.v.outputs.exists != 'true'
        shell: bash
        run: |
          VER="${{ steps.v.outputs.ver }}"
          gh release create "v$VER" dist/TruckPlayer.exe --repo "${{ github.repository }}" \
            --title "卡車播放器 v$VER" --notes "自動打包的 Windows 版 (v$VER)。已安裝的程式會自動提示更新。"
